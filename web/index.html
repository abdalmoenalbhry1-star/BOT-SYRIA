<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#08050f">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>BOT SYRIA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="brand">BOT SYRIA 🇸🇾</div>
    <div class="menu">⋮</div>
  </header>

  <main>

    <section class="hero">
      <div class="brand-big">BOT SYRIA</div>
      <div id="welcome" class="welcome">أهلاً بك 👋</div>
      <div class="slogan">اربح .. تطور .. وحقق أهدافك</div>

      <div class="balance-label">الرصيد الحالي</div>
      <div class="balance">
        <span>1.03</span>
        <small>SYP</small>
      </div>

      <div class="wallet-actions">
        <button class="action receive">✈️<b>استلم</b></button>
        <button class="action send">✈️<b>إرسال</b></button>
      </div>
    </section>

    <section class="tasks">
      <div class="section-title">
        <span></span>
        <h2>مهام الإعلانات</h2>
      </div>

      <article class="task">
        <div class="reward">3.00 ل.س</div>
        <h3>شاهد 100 إعلان يومياً</h3>
        <p>شبكة ADSTERRA</p>
        <div class="progress"><i></i></div>
        <small>0 / 100</small>
        <button>شاهد ▶</button>
      </article>

      <article class="task">
        <div class="reward">3.00 ل.س</div>
        <h3>شاهد 100 إعلان يومياً</h3>
        <p>شبكة GigaPub</p>
        <div class="progress"><i></i></div>
        <small>0 / 100</small>
        <button>شاهد ▶</button>
      </article>

      <article class="task">
        <div class="reward">3.00 ل.س</div>
        <h3>شاهد 100 إعلان يومياً</h3>
        <p>شبكة HilltopAds</p>
        <div class="progress"><i></i></div>
        <small>0 / 100</small>
        <button>شاهد ▶</button>
      </article>
    </section>

  </main>

  <nav class="bottom-nav">
    <button>👤<span>حسابي</span></button>
    <button>🏆<span>المتصدرون</span></button>
    <button class="wallet">▣</button>
    <button>☑<span>المهمات</span></button>
    <button class="active">⌂<span>الرئيسية</span></button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
